name: Build previews and publish Analyst Rushi showcase
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_showcase.py'
      - '.github/workflows/publish-showcase.yml'
      - 'showcase/**'
      - 'themes/**'
      - 'docs/**'
      - 'Screenshot*.png'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powerbi-showcase
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build GIFs, update README and prepare public site
        run: python scripts/build_showcase.py
      - name: Commit only generated GIFs and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/analyst-rushi-hero.gif assets/powerbi-report-preview.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: embed branded hero and original report GIF preview'
            git push origin HEAD:main
          fi
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: analyst-rushi-previews
          path: assets/*.gif
          if-no-files-found: error
      - name: Upload allowlisted static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy public showcase
        id: deployment
        uses: actions/deploy-pages@v4
