name: Build previews and publish Analyst Rushi showcase
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_showcase.py'
      - '.github/workflows/publish-showcase.yml'
      - 'showcase/**'
      - 'themes/**'
      - 'docs/**'
      - 'Screenshot*.png'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powerbi-showcase
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Regenerate previews on latest main and safely commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B preview-publish origin/main
            python scripts/build_showcase.py
            git add assets/analyst-rushi-hero.gif assets/powerbi-report-preview.gif README.md
            if git diff --cached --quiet; then
              echo 'Previews already current; website has been rebuilt.'
              exit 0
            fi
            git commit -m 'docs: embed branded hero and original report GIF preview'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; checking whether main advanced."
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo 'Remote main did not advance; check repository permissions or branch rules.'
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish generated previews after three attempts.'
          exit 1
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: analyst-rushi-previews
          path: assets/*.gif
          if-no-files-found: error
      - name: Upload allowlisted static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy public showcase
        id: deployment
        uses: actions/deploy-pages@v4
